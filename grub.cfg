set timeout=2
set default=0
insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,auto
terminal_output gfxterm
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan
set color_normal=dark-gray/black

menuentry "VUKANG OS" {
    set gfxpayload=1024x768x32,1024x768,auto
    multiboot /boot/vukang.kernel
    boot
}
menuentry "VUKANG OS (bila animation / no splash)" {
    set gfxpayload=1024x768x32,1024x768,auto
    multiboot /boot/vukang.kernel nosplash
    boot
}
menuentry "VUKANG OS (text mode, kompyuta za zamani)" {
    set gfxpayload=text
    multiboot /boot/vukang.kernel
    boot
}
